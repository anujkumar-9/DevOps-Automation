apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-my-app

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: my-app

  template:
    metadata:
      labels:
        app: my-app

    spec:
      containers:
        - name: my-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.containerPort }}