apiVersion: v1
kind: Service

metadata:
  name: {{ .Release.Name }}-my-app

spec:
  type: {{ .Values.service.type }}

  selector:
    app: my-app

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}



#       Helm ka simple concept
# values.yaml
#      ↓
# Templates
#      ↓
# Helm
#      ↓
# Kubernetes YAML
#      ↓
# Kubernetes Deployment + Service

# Chart.yaml → Helm chart ki information.

# values.yaml → Configurable values.

# templates/ → Kubernetes manifests with Helm variables.

# Interview line:

# Helm is a package manager for Kubernetes. It allows us to templatize Kubernetes manifests and manage application deployments using reusable Helm charts.